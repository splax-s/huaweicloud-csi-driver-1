# RBAC for the EVS CSI driver on OpenShift or Kubernetes (the SCC role bindings are ignored outside OpenShift).
# Differences from deploy/evs-csi-plugin/kubernetes:
#   - provisioner and resizer roles read volumeattributesclasses (current sidecars watch them)
#   - snapshotter role can patch volumesnapshotcontents(+/status): csi-snapshotter v8 patches, v4 updated
#   - only the node plugin may use the privileged SCC (it mounts with Bidirectional propagation); the controller
#     runs under nonroot-v2
#   - no Secret permissions: the driver never reads Secrets through the API, the kubelet mounts cloud-config.
#     Upstream granted get/list/create on every Secret in the cluster to both service accounts, so a compromised
#     node plugin (privileged, host network, on every node) could read all of them.
apiVersion: v1
kind: ServiceAccount
metadata: {name: csi-evs-controller-sa, namespace: kube-system}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: csi-evs-node-sa, namespace: kube-system}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-attacher-role}
rules:
- apiGroups: ['']
  resources: [persistentvolumes]
  verbs: [get, list, watch, patch]
- apiGroups: [storage.k8s.io]
  resources: [csinodes]
  verbs: [get, list, watch]
- apiGroups: [storage.k8s.io]
  resources: [volumeattachments]
  verbs: [get, list, watch, patch]
- apiGroups: [storage.k8s.io]
  resources: [volumeattachments/status]
  verbs: [patch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, watch, list, delete, update, create]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-attacher-binding}
subjects: [{kind: ServiceAccount, name: csi-evs-controller-sa, namespace: kube-system}]
roleRef: {kind: ClusterRole, name: csi-evs-attacher-role, apiGroup: rbac.authorization.k8s.io}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-provisioner-role}
rules:
- apiGroups: ['']
  resources: [persistentvolumes]
  verbs: [get, list, watch, create, delete]
- apiGroups: ['']
  resources: [persistentvolumeclaims]
  verbs: [get, list, watch, update]
- apiGroups: [storage.k8s.io]
  resources: [storageclasses, csinodes, volumeattributesclasses]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [events]
  verbs: [list, watch, create, update, patch]
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshots, volumesnapshotcontents]
  verbs: [get, list, watch]
- apiGroups: [storage.k8s.io]
  resources: [volumeattachments]
  verbs: [get, list, watch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, watch, list, delete, update, create]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-provisioner-binding}
subjects: [{kind: ServiceAccount, name: csi-evs-controller-sa, namespace: kube-system}]
roleRef: {kind: ClusterRole, name: csi-evs-provisioner-role, apiGroup: rbac.authorization.k8s.io}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-snapshotter-role}
rules:
- apiGroups: ['']
  resources: [events]
  verbs: [list, watch, create, update, patch]
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshotclasses]
  verbs: [get, list, watch]
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshotcontents]
  verbs: [create, get, list, watch, update, patch, delete]
- apiGroups: [snapshot.storage.k8s.io]
  resources: [volumesnapshotcontents/status]
  verbs: [update, patch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, watch, list, delete, update, create]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-snapshotter-binding}
subjects: [{kind: ServiceAccount, name: csi-evs-controller-sa, namespace: kube-system}]
roleRef: {kind: ClusterRole, name: csi-evs-snapshotter-role, apiGroup: rbac.authorization.k8s.io}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-resizer-role}
rules:
- apiGroups: ['']
  resources: [persistentvolumes]
  verbs: [get, list, watch, patch]
- apiGroups: ['']
  resources: [persistentvolumeclaims, pods]
  verbs: [get, list, watch]
- apiGroups: ['']
  resources: [persistentvolumeclaims/status]
  verbs: [patch]
- apiGroups: ['']
  resources: [events]
  verbs: [list, watch, create, update, patch]
- apiGroups: [storage.k8s.io]
  resources: [volumeattributesclasses]
  verbs: [get, list, watch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, watch, list, delete, update, create]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-resizer-binding}
subjects: [{kind: ServiceAccount, name: csi-evs-controller-sa, namespace: kube-system}]
roleRef: {kind: ClusterRole, name: csi-evs-resizer-role, apiGroup: rbac.authorization.k8s.io}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-nodeplugin-role}
rules:
- apiGroups: ['']
  resources: [events]
  verbs: [get, list, watch, create, update, patch]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: csi-evs-nodeplugin-binding}
subjects: [{kind: ServiceAccount, name: csi-evs-node-sa, namespace: kube-system}]
roleRef: {kind: ClusterRole, name: csi-evs-nodeplugin-role, apiGroup: rbac.authorization.k8s.io}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: csi-evs-controller-sa-scc-nonroot, namespace: kube-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: 'system:openshift:scc:nonroot-v2'}
subjects: [{kind: ServiceAccount, name: csi-evs-controller-sa, namespace: kube-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: csi-evs-node-sa-scc-privileged, namespace: kube-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: 'system:openshift:scc:privileged'}
subjects: [{kind: ServiceAccount, name: csi-evs-node-sa, namespace: kube-system}]
